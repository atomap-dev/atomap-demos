test_non_release_branches:
    image: debian:sid
    script:
    - apt-get update -q
    - apt-get install -qy python3-pip python3-numpy python3-scipy python3-h5py ipython3 python3-natsort python3-sklearn python3-dill python3-ipython-genutils python3-matplotlib python3-skimage python3-dask python3-pint python3-requests python3-statsmodels python3-tqdm python3-traits python3-toolz python3-jupyter-client python3-ipython python3-ipykernel
    - apt-get install -qy python3-sympy --no-install-recommends
    - apt-get install -qy xvfb python3-pytest git
    - pip3 install nbval
    - pip3 install hyperspy[all]
    - git clone -b master --single-branch https://gitlab.com/atomap/atomap.git
    - pip3 install --user atomap/
    - cd notebook_example
    - xvfb-run -a python3 -m pytest --nbval-lax --current-env
    - cd ../nanoparticle_notebook
    - xvfb-run -a python3 -m pytest --nbval-lax --current-env
    - cd ../two_sublattices_notebook
    - xvfb-run -a python3 -m pytest --nbval-lax --current-env
    - cd ../basic_example
    - xvfb-run -a python3 basic_example.py
    - cd ../no_config_parameters/
    - xvfb-run -a python3 no_config_parameters.py
    - xvfb-run -a python3 no_config_parameters_two_sublattices.py
    except:
    - release

test_release_branch:
    image: debian:sid
    script:
    - apt-get update -q
    - apt-get install -qy python3-pip python3-numpy python3-scipy python3-h5py ipython3 python3-natsort python3-sklearn python3-dill python3-ipython-genutils python3-matplotlib python3-skimage python3-dask python3-pint python3-requests python3-statsmodels python3-tqdm python3-traits python3-toolz python3-jupyter-client python3-ipython python3-ipykernel
    - apt-get install -qy python3-sympy --no-install-recommends
    - apt-get install -qy xvfb python3-pytest git
    - pip3 install nbval
    - pip3 install hyperspy[all]
    - git clone -b release --single-branch https://gitlab.com/atomap/atomap.git
    - pip3 install --user atomap/
    - cd notebook_example
    - xvfb-run -a python3 -m pytest --nbval-lax --current-env
    - cd ../nanoparticle_notebook
    - xvfb-run -a python3 -m pytest --nbval-lax --current-env
    - cd ../two_sublattices_notebook
    - xvfb-run -a python3 -m pytest --nbval-lax --current-env
    - cd ../basic_example
    - xvfb-run -a python3 basic_example.py
    - cd ../no_config_parameters/
    - xvfb-run -a python3 no_config_parameters.py
    - xvfb-run -a python3 no_config_parameters_two_sublattices.py
    only:
    - release
