test_notebooks:
    image: ubuntu:latest
    script:
    - apt-get update -q
    - apt-get install -qy python3-pip python3-numpy python3-scipy python3-h5py ipython3 python3-matplotlib python3-natsort python3-sklearn python3-dill python3-ipython-genutils python3-skimage git ipython3-notebook libgl1-mesa-glx python3-pyqt4
    - apt-get install -qy python3-sympy --no-install-recommends
    - pip3 install --upgrade pip
    - pip3 install nbval 
    - pip3 install --upgrade pytest
    - pip3 install hyperspy[all]
    - git clone https://gitlab.com/atomap/atomap.git
    - pip3 install --user atomap/
    - cd notebook_example
    - python3 -m pytest --nbval-lax --current-env
    - cd ../nanoparticle_notebook
    - python3 -m pytest --nbval-lax --current-env
    except:
    - release

test_scripts:
    image: ubuntu:latest
    script:
    - apt-get update -q
    - apt-get install -qy python3-pip python3-numpy python3-scipy python3-h5py ipython3 python3-matplotlib python3-natsort python3-sklearn python3-dill python3-ipython-genutils python3-skimage git ipython3-notebook libgl1-mesa-glx python3-pyqt4
    - apt-get install -qy python3-sympy --no-install-recommends
    - pip3 install --upgrade pip
    - pip3 install hyperspy[all]
    - git clone https://gitlab.com/atomap/atomap.git
    - pip3 install --user atomap/
    - cd basic_example
    - sed -i '1iimport matplotlib\nmatplotlib.use("Agg")' basic_example.py
    - python3 basic_example.py
    - cd ../no_config_parameters/
    - sed -i '1iimport matplotlib\nmatplotlib.use("Agg")' no_config_parameters.py
    - python3 no_config_parameters.py
    - sed -i '1iimport matplotlib\nmatplotlib.use("Agg")' no_config_parameters_two_sublattices.py
    - python3 no_config_parameters_two_sublattices.py
    except:
    - release

test_notebooks_release:
    image: ubuntu:latest
    script:
    - apt-get update -q
    - apt-get install -qy python3-pip python3-numpy python3-scipy python3-h5py ipython3 python3-matplotlib python3-natsort python3-sklearn python3-dill python3-ipython-genutils python3-skimage git ipython3-notebook libgl1-mesa-glx python3-pyqt4
    - apt-get install -qy python3-sympy --no-install-recommends
    - pip3 install --upgrade pip
    - pip3 install nbval
    - pip3 install --upgrade pytest
    - pip3 install hyperspy[all]
    - git clone -b release --single-branch https://gitlab.com/atomap/atomap.git
    - pip3 install --user atomap/
    - cd notebook_example
    - python3 -m pytest --nbval-lax --current-env
    only:
    - release

